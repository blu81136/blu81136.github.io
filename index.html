    <script>
      function layout() {
        const grid = document.querySelector('.grid');
        const imgs = [...grid.querySelectorAll('img')];
        const cols = 3;
        const gap = 4;
        const colW = (grid.clientWidth - gap * (cols - 1)) / cols;
        const colH = new Array(cols).fill(0);

        imgs.forEach(img => {
          const shortest = colH.indexOf(Math.min(...colH));
          const ratio = img.naturalHeight / img.naturalWidth || 1;
          const h = colW * ratio;

          img.style.width = colW + 'px';
          img.style.left = shortest * (colW + gap) + 'px';
          img.style.top = colH[shortest] + 'px';

          colH[shortest] += h + gap;
        });

        grid.style.height = Math.max(...colH) + 'px';
      }

      let loaded = 0;
      const imgs = document.querySelectorAll('.grid img');
      imgs.forEach(img => {
        if (img.complete) { loaded++; }
        else { img.addEventListener('load', () => { loaded++; if (loaded === imgs.length) layout(); }); }
      });
      if (loaded === imgs.length) layout();

      window.addEventListener('resize', layout);
    </script>
